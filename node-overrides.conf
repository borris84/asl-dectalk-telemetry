# node-overrides.conf
#
# Overrides for the node name announcements made by
# write_node_callsigns_dectalk.sh. This file is read every time the script
# runs. After editing it by hand, run the script again to apply the
# changes:
#   sudo write_node_callsigns_dectalk.sh
#
# One entry per line. Blank lines and lines starting with # are ignored.
#
#   override KEY = TEXT
#       Replace the call sign field from the node database. KEY is a node
#       number (that node only) or a call sign (every node with that call
#       sign). Call signs in TEXT are still spelled out.
#
#   text NODE = TEXT
#       Speak TEXT exactly as written for node NODE. DECtalk commands such
#       as [:ra 200] can be used.
#
#   mode KEY = WORDS
#       Change how a node is spoken without changing what is said. KEY is
#       a node number or a call sign. WORDS are "phonetic" or "letters"
#       (like -P), and/or "number" or "no-number" (like -i). Anything not
#       given follows the command line.
#
# For the same node, "text" wins over "override", and a node-number
# override or mode wins over a call sign one. TEXT can't contain "|".
#
# Examples (remove the # to use them):
#   override N2DYI = N2DYI repeater
#   override 506311 = N2DYI hub
#   text 1999 = the lab node
#   mode 506311 = phonetic
#   mode 506312 = letters number
